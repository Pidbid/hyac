services:
  mongodb:
    image: mongo:8
    container_name: hyac_mongodb
    hostname: mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - hyac_network
    healthcheck:
      test: |
        mongosh --host localhost --port 27017 \
          --eval "try { rs.status(); } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb:27017'}]}); }; db.adminCommand({ ping: 1 }).ok ? quit(0) : quit(1)"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
  minio:
    image: minio/minio:latest
    container_name: hyac_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
    - 9000:9000
    - 9001:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_SERVER_URL: "https://oss.${DOMAIN_NAME}"
      MINIO_SCHEME: 'https'
      MINIO_BROWSER: "off" # if you want to use minio console please modify to on
    volumes:
    - /etc/localtime:/etc/localtime:ro
    - minio_data:/data
    networks:
    - hyac_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hyac-minio.rule=Host(`oss.${DOMAIN_NAME}`)"
      - "traefik.http.routers.hyac-minio.entrypoints=websecure"
      - "traefik.http.routers.hyac-minio.tls=true"
      - "traefik.http.services.hyac-minio.loadbalancer.server.port=9000"
      - "traefik.http.services.hyac-minio.loadbalancer.passhostheader=true"
  traefik:
    image: "traefik:latest"
    container_name: "hyac_traefik"
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/dynamic-dev:/etc/traefik/dynamic"
      - "./traefik/certs:/etc/traefik/certs:ro"
    networks:
      - hyac_network
  server:
    build:
      context: ./server
      target: development
    image: hyac_server:dev
    container_name: hyac_server
    restart: unless-stopped
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS}
      MONGODB_USERNAME: ""
      MONGODB_PASSWORD: ""
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      DEV_MODE: "true"
      APP_CODE_PATH_ON_HOST: ${APP_CODE_PATH_ON_HOST}
      DEMO_MODE: "false"
      LSP_MODE: ${LSP_MODE:-sidecar}
      LSP_SIDECAR_URL: ${LSP_SIDECAR_URL:-ws://hyac_lsp_sidecar:9002/lsp}
      LSP_SIDECAR_TIMEOUT_SECONDS: ${LSP_SIDECAR_TIMEOUT_SECONDS:-10}
      LSP_SIDECAR_FALLBACK_LEGACY: ${LSP_SIDECAR_FALLBACK_LEGACY:-true}
    ports:
      - 8000:8000
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
    - /etc/localtime:/etc/localtime:ro
    - /var/run/docker.sock:/var/run/docker.sock
    - ./traefik/dynamic-dev:/traefik/dynamic
    - ./server:/server
    - ./app:/app
    networks:
    - hyac_network
    healthcheck:
      test: ["CMD", "python", "/server/healthcheck.py"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hyac-server.rule=Host(`server.${DOMAIN_NAME}`)"
      - "traefik.http.routers.hyac-server.entrypoints=websecure"
      - "traefik.http.routers.hyac-server.tls=true"
      - "traefik.http.services.hyac-server.loadbalancer.server.port=8000"
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev # We will create this Dockerfile next
    image: hyac_web:dev
    container_name: hyac_web
    ports:
      - "9527:9527"
    volumes:
      - ./web:/app
      - /app/node_modules
    networks:
      - hyac_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hyac-web.rule=Host(`console.${DOMAIN_NAME}`)"
      - "traefik.http.routers.hyac-web.entrypoints=websecure"
      - "traefik.http.routers.hyac-web.tls=true"
      - "traefik.http.services.hyac-web.loadbalancer.server.port=9527"
      - "traefik.http.services.hyac-web.loadbalancer.passhostheader=true"
  app:
    build:
      context: ./app
      target: development
    image: hyac_app:dev
    command: ["echo", "Hyac App image built. This container does not need to run."]
    restart: "no"
    networks:
      - hyac_network
  lsp-sidecar:
    build:
      context: ./app
      target: development
    image: hyac_lsp_sidecar:dev
    container_name: hyac_lsp_sidecar
    command: ["uvicorn", "lsp_sidecar.main:app", "--host", "0.0.0.0", "--port", "9002", "--reload"]
    ports:
      - "9002:9002"
    volumes:
      - ./app:/app
    networks:
      - hyac_network

networks:
  hyac_network:
    driver: bridge
volumes:
  mongodb_data:
    driver: local
  minio_data:
    driver: local
