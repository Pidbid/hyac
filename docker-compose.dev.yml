services:
  mongodb:
    image: bitnami/mongodb:8.0
    container_name: hyac_mongodb
    hostname: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGODB_ROOT_USER: ${MONGODB_USERNAME}
      MONGODB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGODB_ADVERTISED_HOSTNAME: mongodb
      MONGODB_REPLICA_SET_MODE: primary
      MONGODB_REPLICA_SET_NAME: rs0
      MONGODB_REPLICA_SET_KEY: ${MONGODB_PASSWORD}
    volumes:
      - mongodb_data:/bitnami/mongodb
    networks:
      - hyac_network
    healthcheck:
      test: |
        mongosh --host localhost --port 27017 \
          --authenticationDatabase admin \
          -u "${MONGODB_USERNAME}" -p "${MONGODB_PASSWORD}" \
          --eval "if (db.isMaster().ismaster) { quit(0); } else { quit(1); }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
  minio:
    image: bitnami/minio:2025
    container_name: hyac_minio
    restart: unless-stopped
    ports:
    - 9000:9000
    - 9001:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_SERVER_URL: "https://oss.${DOMAIN_NAME}"
      MINIO_SCHEME: 'https'
      MINIO_BROWSER: "off" # if you want to use minio console please modify to on
    volumes:
    - /etc/localtime:/etc/localtime:ro
    - minio_data:/data
    networks:
    - hyac_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    labels:
      - "caddy=oss.${DOMAIN_NAME}"
      - "caddy.reverse_proxy={{upstreams 9000}}"
  caddy:
    build:
      context: ./caddy
    container_name: "hyac_caddy"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      DOCKER_HOST: "unix:///var/run/docker.sock"
      CADDY_DOCKER_CADDYFILE_PATH: "/etc/caddy/Caddyfile"
    volumes:
      - "${PODMAN_SOCKET}:/var/run/docker.sock:ro"
      - "./caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "./caddy/data:/data"
      - "./caddy/config:/config"
      - "./caddy/logs:/var/log/caddy"
    networks:
      - hyac_network
  server:
    build:
      context: ./server
      target: development
    image: hyac_server:dev
    container_name: hyac_server
    restart: unless-stopped
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS}
      MONGODB_USERNAME: ${MONGODB_USERNAME}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      DEV_MODE: "true"
      APP_CODE_PATH_ON_HOST: ${APP_CODE_PATH_ON_HOST}
      DEMO_MODE: "false"
      DOCKER_HOST: "unix:///var/run/docker.sock"
    ports:
      - 8000:8000
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
    - /etc/localtime:/etc/localtime:ro
    - ${PODMAN_SOCKET}:/var/run/docker.sock
    - ./server:/server
    - ./app:/app
    networks:
    - hyac_network
    healthcheck:
      test: ["CMD", "python", "/server/healthcheck.py"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    labels:
      - "caddy=server.${DOMAIN_NAME}"
      - "caddy.reverse_proxy={{upstreams 8000}}"
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev # We will create this Dockerfile next
    image: hyac_web:dev
    container_name: hyac_web
    ports:
      - "9527:9527"
    volumes:
      - ./web:/app
      - /app/node_modules
    networks:
      - hyac_network
    labels:
      - "caddy=console.${DOMAIN_NAME}"
      - "caddy.reverse_proxy={{upstreams 9527}}"
  app:
    build:
      context: ./app
      target: development
    image: hyac_app:dev
    command: ["echo", "Hyac App image built. This container does not need to run."]
    restart: "no"
    networks:
      - hyac_network

networks:
  hyac_network:
    driver: bridge
volumes:
  mongodb_data:
    driver: local
  minio_data:
    driver: local
