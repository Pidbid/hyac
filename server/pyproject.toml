[project]
name = "hyac"
version = "0.1.0"
description = "A python serverless web framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "apscheduler==3.10.4",
  "beanie==2.1.0",
  "captcha==0.7.1",
  "docker==7.1.0",
  "fastapi==0.115.12",
  "httpx==0.27.0",
  "litellm==1.74.3",
  "loguru==0.7.3",
  "minio==7.2.15",
  "pillow==11.2.1",
  "pycryptodome==3.23.0",
  "pydantic-settings==2.9.1",
  "pyjwt==2.10.1",
  "pymongo==4.13.1",
  "python-multipart==0.0.20",
  "pyyaml==6.0.2",
  "redis==6.1.0",
  "sse-starlette==2.4.1",
  "thefuzz==0.22.1",
  "uvicorn==0.34.2",
  "watchfiles==1.0.5",
  "websockets==15.0.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]
