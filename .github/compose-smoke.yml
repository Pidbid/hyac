services:
  mongo-keyfile-init:
    image: mongo:8.0
    user: "0:0"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        umask 077
        openssl rand -base64 756 > /keyfile/mongo-keyfile
        chown "$$(id -u mongodb):$$(id -g mongodb)" /keyfile/mongo-keyfile
        chmod 0400 /keyfile/mongo-keyfile
        test -s /keyfile/mongo-keyfile
    volumes:
      - mongo_keyfile:/keyfile

  mongodb:
    image: mongo:8.0
    container_name: hyac-ci-mongodb
    hostname: mongodb
    depends_on:
      mongo-keyfile-init:
        condition: service_completed_successfully
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${CI_SMOKE_MONGO_USERNAME:?set CI-only Mongo username}
      MONGO_INITDB_ROOT_PASSWORD: ${CI_SMOKE_MONGO_PASSWORD:?set CI-only Mongo password}
    command:
      - mongod
      - --replSet
      - rs0
      - --keyFile
      - /run/mongo-keyfile/mongo-keyfile
      - --bind_ip_all
      - --auth
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          -u "$$MONGO_INITDB_ROOT_USERNAME"
          -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'db.adminCommand({ ping: 1 }).ok'
          | grep -Fx 1 >/dev/null
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 10s
    volumes:
      - mongodb_data:/data/db
      - mongo_keyfile:/run/mongo-keyfile:ro

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    environment:
      MONGODB_USERNAME: ${CI_SMOKE_MONGO_USERNAME:?set CI-only Mongo username}
      MONGODB_PASSWORD: ${CI_SMOKE_MONGO_PASSWORD:?set CI-only Mongo password}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        mongosh --host mongodb:27017 --quiet \
          -u "$${MONGODB_USERNAME}" -p "$${MONGODB_PASSWORD}" \
          --authenticationDatabase admin --eval '
            try {
              rs.status();
            } catch (error) {
              rs.initiate({
                _id: "rs0",
                members: [{ _id: 0, host: "mongodb:27017" }]
              });
            }
          '
        for attempt in $$(seq 1 30); do
          if mongosh --host mongodb:27017 --quiet \
            -u "$${MONGODB_USERNAME}" -p "$${MONGODB_PASSWORD}" \
            --authenticationDatabase admin \
            --eval 'rs.status().myState' | grep -Fx 1; then
            exit 0
          fi
          sleep 1
        done
        exit 1

  rustfs:
    image: rustfs/rustfs:latest
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${CI_SMOKE_S3_ACCESS_KEY:?set CI-only S3 access key}
      RUSTFS_SECRET_KEY: ${CI_SMOKE_S3_SECRET_KEY:?set CI-only S3 secret key}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "status=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/); test \"$$status\" = \"403\" -o \"$$status\" = \"200\"",
        ]
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 5s
    volumes:
      - rustfs_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hyac-ci-rustfs.rule=Host(`oss.ci.example.com`)"
      - "traefik.http.routers.hyac-ci-rustfs.entrypoints=ci"
      - "traefik.http.routers.hyac-ci-rustfs.tls=true"
      - "traefik.http.services.hyac-ci-rustfs.loadbalancer.server.port=9000"
      - "traefik.http.services.hyac-ci-rustfs.loadbalancer.passhostheader=true"

  traefik:
    image: traefik:v3.6.1
    command:
      - "--api.dashboard=false"
      - "--entrypoints.ci.address=:8443"
      - "--entrypoints.traefik.address=:8080"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--ping=true"
      - "--ping.entrypoint=traefik"
    ports:
      - "127.0.0.1:18443:8443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${CI_SMOKE_DYNAMIC_DIR:?set CI-only dynamic config directory}:/etc/traefik/dynamic:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 5s

  server:
    image: wicos/hyac_server:${CI_SMOKE_IMAGE_TAG:?set released image tag}
    container_name: hyac_server
    environment:
      DOMAIN_NAME: ci.example.com
      EMAIL_ADDRESS: ci@example.com
      MONGODB_USERNAME: ${CI_SMOKE_MONGO_USERNAME:?set CI-only Mongo username}
      MONGODB_PASSWORD: ${CI_SMOKE_MONGO_PASSWORD:?set CI-only Mongo password}
      S3_ACCESS_KEY: ${CI_SMOKE_S3_ACCESS_KEY:?set CI-only S3 access key}
      S3_SECRET_KEY: ${CI_SMOKE_S3_SECRET_KEY:?set CI-only S3 secret key}
      S3_INTERNAL_ENDPOINT: rustfs:9000
      S3_EXTERNAL_ENDPOINT: oss.ci.example.com:18443
      S3_SECURE_INTERNAL: "false"
      S3_SECURE_EXTERNAL: "true"
      S3_PUBLIC_BASE_URL: https://oss.ci.example.com:18443
      SECRET_KEY: ci-secret-key-used-only-for-production-smoke
      DEFAULT_ADMIN_USER: operator
      DEFAULT_ADMIN_PASSWORD: ${CI_SMOKE_ADMIN_PASSWORD:?set CI-only admin password}
      SERVER_IMAGE_TAG: ${CI_SMOKE_IMAGE_TAG:?set released image tag}
      WEB_IMAGE_TAG: ${CI_SMOKE_IMAGE_TAG:?set released image tag}
      APP_IMAGE_TAG: ${CI_SMOKE_IMAGE_TAG:?set released image tag}
      DEV_MODE: "false"
      CI_SMOKE_MODE: "true"
      RUNTIME_INGRESS_ENTRYPOINT: ci
      RUNTIME_INGRESS_TLS: "true"
      DEMO_MODE: "false"
      LSP_MODE: sidecar
      LSP_SIDECAR_URL: ws://hyac_lsp_sidecar:9002/lsp
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
      lsp-sidecar:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CI_SMOKE_DYNAMIC_DIR:?set CI-only dynamic config directory}:/traefik/dynamic
    healthcheck:
      test: ["CMD", "python", "/server/healthcheck.py"]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hyac-ci-server.rule=Host(`server.ci.example.com`) && !PathPrefix(`/internal`)"
      - "traefik.http.routers.hyac-ci-server.entrypoints=ci"
      - "traefik.http.routers.hyac-ci-server.tls=true"
      - "traefik.http.services.hyac-ci-server.loadbalancer.server.port=8000"

  app:
    image: wicos/hyac_app:${CI_SMOKE_IMAGE_TAG:?set released image tag}
    command: ["python", "-c", "import time; time.sleep(3600)"]
    restart: "no"

  lsp-sidecar:
    image: wicos/hyac_app:${CI_SMOKE_IMAGE_TAG:?set released image tag}
    container_name: hyac_lsp_sidecar
    command: ["uvicorn", "lsp_sidecar.main:app", "--host", "0.0.0.0", "--port", "9002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9002/health', timeout=5)"]
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 5s

  web:
    image: wicos/hyac_web:${CI_SMOKE_IMAGE_TAG:?set released image tag}
    environment:
      VITE_SERVICE_BASE_URL: https://server.ci.example.com:18443
    depends_on:
      server:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hyac-ci-web.rule=Host(`console.ci.example.com`)"
      - "traefik.http.routers.hyac-ci-web.entrypoints=ci"
      - "traefik.http.routers.hyac-ci-web.tls=true"
      - "traefik.http.services.hyac-ci-web.loadbalancer.server.port=80"
      - "traefik.http.services.hyac-ci-web.loadbalancer.passhostheader=true"

volumes:
  mongo_keyfile:
  mongodb_data:
  rustfs_data:
